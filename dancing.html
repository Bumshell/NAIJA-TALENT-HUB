<!DOCTYPE html>
<html>
<head>
    <title>Dancing - Naija Talent Hub</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #16002b, #3b0057, #001f3f);
            color: white;
            text-align: center;
        }

        header {
            padding: 35px 20px;
        }

        .logo {
            width: 90px;
            height: 90px;
            object-fit: contain;
        }

        h1 {
            font-size: 42px;
            margin: 15px 0 5px;
            color: #ffcc00;
        }

        .intro {
            color: #eeeeee;
            font-size: 18px;
        }

        .dancers {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            padding: 30px 20px;
        }

        .dancer {
            width: 240px;
            padding: 30px 20px;
            border: 2px solid #ffcc00;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.35);
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.2);
        }

        .dance-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .dancer h2 {
            color: #ffcc00;
        }

        .dancer p {
            color: #dddddd;
        }

        button {
            background: #ffcc00;
            color: #16002b;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: white;
        }

        .back {
            margin: 25px 0 40px;
        }
    </style>
</head>

<body>

    <header>

        <img src="naija-logo.png" alt="Naija Talent Hub Logo" class="logo">

        <h1>💃 Dancing</h1>

        <p class="intro">
            Feel the rhythm. Discover amazing dance talents.
        </p>

    </header>

    <div class="dancers">

        <div class="dancer">

            <div class="dance-icon">🕺</div>

            <h2>Dancer 1</h2>

            <p>Dance Talent</p>

            <button onclick="window.location.href='dancer1.html'">
                View Dancer
            </button>

        </div>


        <div class="dancer">

            <div class="dance-icon">💃</div>

            <h2>Dancer 2</h2>

            <p>Dance Talent</p>

            <button onclick="window.location.href='dancer2.html'">
                View Dancer
            </button>

        </div>


        <div class="dancer">

            <div class="dance-icon">🕺</div>

            <h2>Dancer 3</h2>

            <p>Dance Talent</p>

            <button onclick="window.location.href='dancer3.html'">
                View Dancer
            </button>

        </div>

    </div>


    <div class="back">

        <button onclick="window.location.href='talents.html'">
            ← Back to Talents
        </button>

    </div>

</body>
</html>
